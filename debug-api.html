<!DOCTYPE html>
<html>
  <head>
    <title>Debug API</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .result {
        background: #f5f5f5;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
      }
      .error {
        background: #ffebee;
        color: #c62828;
      }
      .success {
        background: #e8f5e8;
        color: #2e7d32;
      }
      button {
        margin: 5px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Debug API - Stationery Management</h1>

    <div>
      <h3>1. Test Login</h3>
      <button onclick="testLogin()">Test Login (manager/password)</button>
      <div id="loginResult" class="result"></div>
    </div>

    <div>
      <h3>2. Test Get My Requests</h3>
      <button onclick="testMyRequests()">Get My Requests</button>
      <div id="myRequestsResult" class="result"></div>
    </div>

    <div>
      <h3>3. Test Get Pending Approvals</h3>
      <button onclick="testPendingApprovals()">Get Pending Approvals</button>
      <div id="pendingResult" class="result"></div>
    </div>

    <div>
      <h3>4. Test Create Request</h3>
      <button onclick="testCreateRequest()">Create Test Request</button>
      <div id="createResult" class="result"></div>
    </div>

    <script>
      let token = "";

      async function testLogin() {
        const resultDiv = document.getElementById("loginResult");
        resultDiv.innerHTML = "Testing login...";
        resultDiv.className = "result";

        try {
          const response = await fetch("http://localhost:8080/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              username: "manager",
              password: "password",
            }),
          });

          const responseText = await response.text();
          console.log("Login response:", response.status, responseText);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${responseText}`);
          }

          const data = JSON.parse(responseText);
          token = data.token;

          resultDiv.innerHTML = `
                    <div class="success">
                        <strong>Login Success!</strong><br>
                        Token: ${token.substring(0, 50)}...<br>
                        User: ${data.employee.name} (${data.employee.role})<br>
                        Employee No: ${data.employee.employeeNo}
                    </div>
                `;
          resultDiv.className = "result success";
        } catch (error) {
          resultDiv.innerHTML = `
                    <div class="error">
                        <strong>Login Error:</strong><br>
                        ${error.message}
                    </div>
                `;
          resultDiv.className = "result error";
        }
      }

      async function testMyRequests() {
        const resultDiv = document.getElementById("myRequestsResult");

        if (!token) {
          resultDiv.innerHTML = '<div class="error">Please login first!</div>';
          resultDiv.className = "result error";
          return;
        }

        resultDiv.innerHTML = "Fetching my requests...";
        resultDiv.className = "result";

        try {
          const response = await fetch(
            "http://localhost:8080/api/requests?mine=true",
            {
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            }
          );

          const responseText = await response.text();
          console.log("My requests response:", response.status, responseText);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${responseText}`);
          }

          const data = JSON.parse(responseText);

          resultDiv.innerHTML = `
                    <div class="success">
                        <strong>My Requests Success!</strong><br>
                        Total: ${data.totalElements} requests<br>
                        Content: ${JSON.stringify(data.content, null, 2)}
                    </div>
                `;
          resultDiv.className = "result success";
        } catch (error) {
          resultDiv.innerHTML = `
                    <div class="error">
                        <strong>My Requests Error:</strong><br>
                        ${error.message}
                    </div>
                `;
          resultDiv.className = "result error";
        }
      }

      async function testPendingApprovals() {
        const resultDiv = document.getElementById("pendingResult");

        if (!token) {
          resultDiv.innerHTML = '<div class="error">Please login first!</div>';
          resultDiv.className = "result error";
          return;
        }

        resultDiv.innerHTML = "Fetching pending approvals...";
        resultDiv.className = "result";

        try {
          const response = await fetch(
            "http://localhost:8080/api/requests?inbox=true",
            {
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            }
          );

          const responseText = await response.text();
          console.log(
            "Pending approvals response:",
            response.status,
            responseText
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${responseText}`);
          }

          const data = JSON.parse(responseText);

          resultDiv.innerHTML = `
                    <div class="success">
                        <strong>Pending Approvals Success!</strong><br>
                        Total: ${data.totalElements} requests<br>
                        Content: ${JSON.stringify(data.content, null, 2)}
                    </div>
                `;
          resultDiv.className = "result success";
        } catch (error) {
          resultDiv.innerHTML = `
                    <div class="error">
                        <strong>Pending Approvals Error:</strong><br>
                        ${error.message}
                    </div>
                `;
          resultDiv.className = "result error";
        }
      }

      async function testCreateRequest() {
        const resultDiv = document.getElementById("createResult");

        if (!token) {
          resultDiv.innerHTML = '<div class="error">Please login first!</div>';
          resultDiv.className = "result error";
          return;
        }

        resultDiv.innerHTML = "Creating test request...";
        resultDiv.className = "result";

        try {
          const response = await fetch("http://localhost:8080/api/requests", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              stationeryId: 1,
              quantity: 5,
              toDate: "2024-12-31",
              reason: "Test request from debug page",
            }),
          });

          const responseText = await response.text();
          console.log(
            "Create request response:",
            response.status,
            responseText
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${responseText}`);
          }

          const data = JSON.parse(responseText);

          resultDiv.innerHTML = `
                    <div class="success">
                        <strong>Create Request Success!</strong><br>
                        Request ID: ${data.id}<br>
                        Request Number: ${data.requestNumber}<br>
                        Status: ${data.status}<br>
                        Full Response: ${JSON.stringify(data, null, 2)}
                    </div>
                `;
          resultDiv.className = "result success";
        } catch (error) {
          resultDiv.innerHTML = `
                    <div class="error">
                        <strong>Create Request Error:</strong><br>
                        ${error.message}
                    </div>
                `;
          resultDiv.className = "result error";
        }
      }
    </script>
  </body>
</html>
