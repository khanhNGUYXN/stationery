<!DOCTYPE html>
<html>
  <head>
    <title>Simple API Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .test {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .success {
        background: #d4edda;
        border-color: #c3e6cb;
      }
      .error {
        background: #f8d7da;
        border-color: #f5c6cb;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Simple API Test</h1>

    <div class="test">
      <h3>Test 1: Health Check</h3>
      <button onclick="testHealth()">Test Health</button>
      <div id="healthResult"></div>
    </div>

    <div class="test">
      <h3>Test 2: Login</h3>
      <button onclick="testLogin()">Test Login</button>
      <div id="loginResult"></div>
    </div>

    <div class="test">
      <h3>Test 3: Get Requests (after login)</h3>
      <button onclick="testRequests()">Test Requests</button>
      <div id="requestsResult"></div>
    </div>

    <script>
      let token = "";

      async function testHealth() {
        const resultDiv = document.getElementById("healthResult");
        resultDiv.innerHTML = "Testing...";

        try {
          const response = await fetch(
            "http://localhost:8080/api/actuator/health"
          );
          const text = await response.text();

          if (response.ok) {
            resultDiv.innerHTML = `<div class="success">✅ Health OK: ${text}</div>`;
          } else {
            resultDiv.innerHTML = `<div class="error">❌ Health Error: ${response.status} - ${text}</div>`;
          }
        } catch (error) {
          resultDiv.innerHTML = `<div class="error">❌ Connection Error: ${error.message}</div>`;
        }
      }

      async function testLogin() {
        const resultDiv = document.getElementById("loginResult");
        resultDiv.innerHTML = "Testing login...";

        try {
          const response = await fetch("http://localhost:8080/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: "manager", password: "password" }),
          });

          const text = await response.text();
          console.log("Login response:", response.status, text);

          if (response.ok) {
            const data = JSON.parse(text);
            token = data.token;
            resultDiv.innerHTML = `<div class="success">✅ Login OK: ${data.employee.name} (${data.employee.role})</div>`;
          } else {
            resultDiv.innerHTML = `<div class="error">❌ Login Error: ${response.status} - ${text}</div>`;
          }
        } catch (error) {
          resultDiv.innerHTML = `<div class="error">❌ Login Error: ${error.message}</div>`;
        }
      }

      async function testRequests() {
        const resultDiv = document.getElementById("requestsResult");

        if (!token) {
          resultDiv.innerHTML =
            '<div class="error">❌ Please login first!</div>';
          return;
        }

        resultDiv.innerHTML = "Testing requests...";

        try {
          const response = await fetch(
            "http://localhost:8080/api/requests?mine=true",
            {
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            }
          );

          const text = await response.text();
          console.log("Requests response:", response.status, text);

          if (response.ok) {
            const data = JSON.parse(text);
            resultDiv.innerHTML = `<div class="success">✅ Requests OK: Found ${data.totalElements} requests</div>`;
          } else {
            resultDiv.innerHTML = `<div class="error">❌ Requests Error: ${response.status} - ${text}</div>`;
          }
        } catch (error) {
          resultDiv.innerHTML = `<div class="error">❌ Requests Error: ${error.message}</div>`;
        }
      }
    </script>
  </body>
</html>
