<!DOCTYPE html>
<html>
  <head>
    <title>Test Create Request</title>
  </head>
  <body>
    <h1>Test Create Request</h1>
    <button onclick="testCreateRequest()">Create New Request</button>
    <div id="result"></div>

    <script>
      async function testCreateRequest() {
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "Creating request...";

        try {
          // 1. Login
          const loginResponse = await fetch(
            "http://localhost:8080/api/auth/login",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: "manager",
                password: "password",
              }),
            }
          );
          const loginData = await loginResponse.json();
          const token = loginData.token;

          // 2. Create Request
          const createResponse = await fetch(
            "http://localhost:8080/api/requests",
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                stationeryId: 2,
                quantity: 3,
                toDate: "2024-12-31",
                reason: "Test request from HTML page",
              }),
            }
          );

          if (!createResponse.ok) {
            throw new Error(`Create failed: ${createResponse.status}`);
          }

          const createData = await createResponse.json();

          // 3. Get My Requests
          const requestsResponse = await fetch(
            "http://localhost:8080/api/requests?mine=true",
            {
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
              },
            }
          );
          const requestsData = await requestsResponse.json();

          resultDiv.innerHTML = `
                    <h3>Create Request Success:</h3>
                    <p>Request ID: ${createData.id}</p>
                    <p>Request Number: ${createData.requestNumber}</p>
                    <p>Status: ${createData.status}</p>
                    
                    <h3>My Requests (Total: ${requestsData.totalElements}):</h3>
                    <pre>${JSON.stringify(requestsData.content, null, 2)}</pre>
                `;
        } catch (error) {
          resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        }
      }
    </script>
  </body>
</html>
